name: Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# needs to be top-level (not under `workflow_dispatch`)
permissions:
  contents: read
  packages: write

# also top-level
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha_image: ${{ steps.vars.outputs.sha_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set vars (image name & sha tag)
        id: vars
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/app
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_image=$IMAGE@sha256:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
